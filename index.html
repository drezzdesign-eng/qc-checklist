<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4f91">
<title>C Zero QC Inspection</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
/* Layout: app bar + role tabs over a single working column; QC form rows, data tables, KPI strip for admin */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#18212b; --muted:#5d6b7a; --line:#d5dce3; --soft:#f5f7f9;
  --accent:#1d4f91; --accent-ink:#ffffff; --accent-soft:#e3ebf6;
  --ok:#1f7a4a; --ok-bg:#e3f3ea; --ng:#b3261e; --ng-bg:#fbe5e3; --hold:#a35a00; --hold-bg:#fdf0dc;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151b; --paper:#18202a; --ink:#e4e9ef; --muted:#93a1b0; --line:#2c3743; --soft:#1e2833;
  --accent:#6fa3e8; --accent-ink:#0d1520; --accent-soft:#1d2d44;
  --ok:#5cc58b; --ok-bg:#163326; --ng:#f2867d; --ng-bg:#3a1c1a; --hold:#f0b45c; --hold-bg:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --paper:#18202a; --ink:#e4e9ef; --muted:#93a1b0; --line:#2c3743; --soft:#1e2833;
  --accent:#6fa3e8; --accent-ink:#0d1520; --accent-soft:#1d2d44;
  --ok:#5cc58b; --ok-bg:#163326; --ng:#f2867d; --ng-bg:#3a1c1a; --hold:#f0b45c; --hold-bg:#3a2a12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;padding:0 16px}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:700;letter-spacing:.02em}
h3{font-size:17px;font-weight:600}
.lbl,label{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px}
.mono{font-family:var(--f-mono)}
input[type=text],input[type=password],input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:500;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--ng);border-color:var(--ng)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.err{color:var(--ng);font-size:14px}
.note{background:var(--accent-soft);border-radius:4px;padding:10px 12px;font-size:14px}

/* app bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand .co{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-size:12px}
.brand h1{font-size:24px;font-weight:700;line-height:1.05}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.role{font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.1em;padding:3px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.03em;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--ng);color:var(--paper);font-size:12px;font-family:var(--f-body);text-align:center;margin-left:4px}

/* login */
.login{max-width:380px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login h1{font-size:28px;font-weight:700}

/* checklist */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--soft)}
.seg button{font:inherit;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;border:0;background:transparent;color:var(--muted);padding:7px 14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.sec-h{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:4px}
.sec-h .ltr{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--accent);line-height:1}
.sec-h h2{font-size:20px;letter-spacing:.06em}
.group{padding:12px 0;border-bottom:1px solid var(--line)}
.group:last-child{border-bottom:0;padding-bottom:0}
.g-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.linkbtn{font:inherit;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:8px 10px;border-radius:4px;border-left:3px solid transparent}
.item:nth-child(even){background:var(--soft)}
.item.is-ok{border-left-color:var(--ok)}
.item.is-ng{border-left-color:var(--ng);background:var(--ng-bg)}
.code{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.res{display:inline-flex;gap:6px}
.res button,.res span{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;width:48px;padding:6px 0;border-radius:4px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer;text-align:center}
.res .ok[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.res .ng[aria-pressed=true]{background:var(--ng);border-color:var(--ng);color:var(--paper)}
.need-rem input[data-rem]{border-color:var(--ng);background:var(--paper)}
.res button:disabled{cursor:not-allowed;opacity:.85}
.scanbox{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.scanbox .val{flex:1 1 180px;min-width:0;font-family:var(--f-mono);font-size:15px;padding:8px 10px;border:1px dashed var(--line);border-radius:4px;background:var(--soft);display:flex;align-items:center;overflow-wrap:anywhere}
.scanbox .val.has{border-style:solid;border-color:var(--ok);background:var(--ok-bg);color:var(--ink)}
.led-sel{flex:1 1 200px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
label.btn{font-family:var(--f-body);font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;display:inline-flex;align-items:center;position:relative}
label.btn.primary{color:var(--accent-ink)}
.scanbox input.val-in{flex:1 1 180px;font-family:var(--f-mono);font-size:15px}
.scanbox input.val-in.has{border-color:var(--ok);background:var(--ok-bg)}
.scanhelp{font-size:12px;color:var(--muted);flex-basis:100%}
.scanprev{width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.st-rej{background:var(--ng-bg);color:var(--ng)}
.kpi.hold .v{color:var(--hold)}
.autotag{font-family:var(--f-display);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:3px;vertical-align:1px}
.rbadge{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;min-width:48px;padding:5px 10px;border-radius:4px;text-align:center;cursor:default;display:inline-block}
.rbadge.ok{background:var(--ok-bg);color:var(--ok)} .rbadge.ng{background:var(--ng);color:var(--paper)} .rbadge.none{background:var(--soft);color:var(--muted)}
.readonly{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:14px;color:var(--muted)}
.remark{grid-column:2 / -1;display:flex;gap:8px;flex-wrap:wrap}
.remark input{flex:1 1 150px;font-size:14px;padding:6px 9px}
.remark .ro{font-size:13px;color:var(--muted)}
.status{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;padding:3px 10px;border-radius:4px;font-size:14px;white-space:nowrap;display:inline-block}
.st-pending{background:var(--soft);color:var(--muted)}
.st-pass{background:var(--ok-bg);color:var(--ok)}
.st-hold{background:var(--hold-bg);color:var(--hold)}
.st-ver{background:var(--accent-soft);color:var(--accent)}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px}
.prog{flex:1 1 180px;display:flex;flex-direction:column;gap:5px;min-width:0}
.pbar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.counts{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.warn{background:var(--hold-bg);color:var(--hold);border-radius:4px;padding:10px 12px;font-size:14px}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.ok .v{color:var(--ok)} .kpi.ng .v{color:var(--ng)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 70px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.hbar .track{height:10px;background:var(--soft);border-radius:2px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--ng)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--f-body)}

/* signature */
.pad{border:1px dashed var(--muted);border-radius:4px;background:var(--paper);touch-action:none;width:100%;height:160px;display:block;cursor:crosshair}
.sigimg{max-width:240px;height:auto;background:#fff;border:1px solid var(--line);border-radius:4px}
.signoff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.signoff .col{display:flex;flex-direction:column;gap:6px;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:4px;font-size:14px;z-index:20;max-width:90vw}

@media (max-width:960px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){
  .grid2,.signoff{grid-template-columns:1fr}
  .item{grid-template-columns:34px minmax(0,1fr)}
  .res{grid-column:2}
  .sheet{padding:16px}
  .hbar{grid-template-columns:minmax(0,1fr) 60px 56px}
}
@media (prefers-reduced-motion:reduce){.pbar i{transition:none}}
/* live scanner */
.scanmodal{position:fixed;inset:0;z-index:30;background:rgba(5,10,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.scanmodal #reader{width:min(92vw,440px);background:#000;border-radius:8px;overflow:hidden}
.scanmodal #reader{position:relative}
.scanmodal #reader video{width:100%;height:auto;display:block;max-height:60vh;object-fit:cover}
.scanmodal .aim{position:absolute;inset:10%;border:3px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.25);pointer-events:none}
.scanmodal .t{color:#fff;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.04em}
.scanmodal .h{color:#c9d3de;font-size:14px;text-align:center;max-width:440px}
.scanmodal .btn{min-width:140px}
.scanmodal .aim::after{content:"";position:absolute;left:6%;right:6%;height:2px;background:#4ade80;box-shadow:0 0 12px #4ade80;top:10%;animation:scanline 1.8s ease-in-out infinite alternate}
@keyframes scanline{from{top:8%}to{top:92%}}
.scanok{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(5,10,18,.55);padding:16px}
.scanok .box{background:#ffffff;color:#14532d;border-radius:14px;padding:24px 28px;min-width:260px;max-width:90vw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .25s ease-out}
.scanok .ck{width:64px;height:64px;border-radius:50%;background:#16a34a;display:flex;align-items:center;justify-content:center}
.scanok .tt{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.03em}
.scanok .vv{font-family:var(--f-mono);font-size:17px;color:#18212b;overflow-wrap:anywhere}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.scanmodal .aim::after{animation:none;top:50%}.scanok .box{animation:none}}
.demo-tag{background:var(--hold-bg);color:var(--hold)}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="sheet login">
    <div class="brand"><div class="co">C Zero Sdn Bhd · Quality Control</div><h1>QC Inspection</h1></div>
    <p class="muted">Connecting to the inspection records…</p>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- checklist definition ---------- */
const SECTIONS_V1=[
 {ltr:"A",title:"APPEARANCE CHECK",groups:[
  {n:"1",title:"Enclosure",items:[["1a","Painting finishing"],["1b","Screws complete and tight"],["1c","Logo, status light & ambient light laser-cut finishing"]]},
  {n:"2",title:"Decorative Panel",items:[["2a","Water transfer printing finishing"],["2b","Panel fixed properly in position"]]},
  {n:"3",title:"LCD",items:[["3a","Protective screen condition"],["3b","LCD condition"]]},
  {n:"4",title:"Nameplate",items:[["4a","Nameplate fixed properly"],["4b","Nameplate ID matches charging pile ID"],["4c","Nameplate ID matches packaging box ID"]]}]},
 {ltr:"B",title:"FUNCTIONS CHECK",groups:[
  {n:"1",title:"Charger Unit",items:[["1a","Power on"],["1b","Status light function and any light leaking"],["1c","Logo light function and any light leaking"],["1d","Ambient light function and any light leaking"],["1e","RFID charging test"],["1f","Remote charging test"],["1g","Direct charging test"]]},
  {n:"2",title:"LCD",items:[["2a","Display working properly"],["2b","Display condition"]]},
  {n:"3",title:"Communications",items:[["3a","WiFi connection"],["3b","OCPP URL (correct server URL)"]]},
  {n:"4",title:"CCTV",items:[["4a","CCTV LED indicator",{led:"led"}],["4b","CCTV QR ID",{scan:"cctvId"}]]},
  {n:"5",title:"Installation Accessories & Documents",items:[["5a","Wall mount bracket"],["5b","Wall mount screw pack"],["5c","User manual"]]}]}];
const SECTIONS=[
 {ltr:"A",title:"APPEARANCE CHECK",groups:[
  {n:"1",title:"Enclosure",items:[["1a","Painting finishing"],["1b","Screws complete and tight"],["1c","Logo, status light & ambient light laser-cut finishing"]]},
  {n:"2",title:"Decorative Panel",items:[["2a","Water transfer printing finishing"],["2b","Panel fixed properly in position"]]},
  {n:"3",title:"LCD",items:[["3a","Protective screen condition"],["3b","LCD touch screen condition"]]},
  {n:"4",title:"Nameplate",items:[["4a","Nameplate fixed properly"],["4b","Nameplate ID matches charging pile ID",{scan:"nameplateId",match:true}],["4c","Packaging box ID matches charging pile ID",{scan:"boxId",match:true}]]}]},
 {ltr:"B",title:"FUNCTIONS CHECK",groups:[
  {n:"1",title:"Charger Unit",items:[["1a","Power on"],["1b","LCD touch screen display working properly"],["1c","WiFi connection"],["1d","OCPP URL (correct server URL)"],["1e","Status light function and any light leaking"],["1f","Logo light function and any light leaking"],["1g","Ambient light function and any light leaking"],["1h","RFID charging mode test"],["1i","Plug & charge mode test"],["1j","CCTV indication light",{led:"led"}],["1k","CCTV ID",{scan:"cctvId",auto:true}],["1l","CCTV QR sticker condition"]]},
  {n:"2",title:"P.Circle App",note:"Reminder: the P.Circle app must be UNBOUND from the charger after app testing is complete.",items:[["2a","P.Circle app BIND to charger test"],["2b","P.Circle app start charging test"],["2c","P.Circle app stop charging test"],["2d","P.Circle app bind to CCTV function test"],["2e","CCTV QR sticker matches CCTV unit ID"],["2f","P.Circle app UNBIND from charger"],["2g","CCTV indication light after UNBIND",{led:"led2"}]]},
  {n:"3",title:"Installation Accessories & Documents",items:[["3a","Wall mount bracket"],["3b","Wall mount screw pack"],["3c","User manual"]]}]}];
function flatItems(secs){const out=[];secs.forEach(s=>s.groups.forEach(g=>g.items.forEach(([c,t,o])=>out.push({key:s.ltr+"-"+c,code:s.ltr+c,text:t,opt:o||{},group:s.ltr+g.n+" "+g.title}))));return out}
const ITEMS=flatItems(SECTIONS),ITEMS_V1=flatItems(SECTIONS_V1);
const ITEM=Object.fromEntries(ITEMS.map(i=>[i.key,i])),ITEM_V1=Object.fromEntries(ITEMS_V1.map(i=>[i.key,i]));
function secFor(i){return Number(i&&i.cl)===2?SECTIONS:SECTIONS_V1}
function itemOf(i,k){return (Number(i&&i.cl)===2?ITEM:ITEM_V1)[k]}
const SCAN_LABEL={pileId:"Charging pile ID",nameplateId:"Nameplate ID",boxId:"Packaging box ID",cctvId:"CCTV ID"};
function normId(v){return String(v||"").trim().toUpperCase().replace(/\s+/g,"")}
function idsMatch(a,b){a=normId(a);b=normId(b);if(!a||!b)return false;if(a===b)return true;return Math.min(a.length,b.length)>=6&&(a.includes(b)||b.includes(a))}
function applyAutos(f){
  ITEMS.forEach(it=>{const o=it.opt,k=it.key;
    if(o.led){if(f[o.led])f.res[k]=f[o.led]==="Green blinking"?"OK":"NG";else delete f.res[k]}
    else if(o.scan&&o.match){const v=f[o.scan];if(v&&f.pileId){const okm=idsMatch(v,f.pileId);f.res[k]=okm?"OK":"NG";if(!okm&&!(f.rem[k]||"").trim())f.rem[k]="ID mismatch: "+v}else delete f.res[k]}
    else if(o.scan&&o.auto){if((f[o.scan]||"").trim())f.res[k]="OK";else delete f.res[k]}
  });
}
function isAuto(o){return !!(o&&(o.led||(o.scan&&(o.match||o.auto))))}
const STATUS_INFO={PASS:["st-pass","PASS · FG"],QUARANTINE:["st-hold","QUARANTINE"],REJECT:["st-rej","REJECT"],"ON HOLD":["st-hold","ON HOLD"]};

function statusPill(i){const s=STATUS_INFO[i.status];return s?`<span class="status ${s[0]}">${s[1]}</span>`:'<span class="status st-pending">AWAITING VERIFIER</span>'}

/* ---------- helpers ---------- */
function today(){return ymd(new Date())}
function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return ymd(d)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dmy(s){if(!s)return"-";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m+"/"+y}
function dt(iso){if(!iso)return"-";const d=new Date(iso);return dmy(ymd(d))+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pct(a,b){return b?(a/b*100).toFixed(1)+"%":"–"}
function $(s){return document.querySelector(s)}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){return null}}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
async function hashPin(u,p){const t=new TextEncoder().encode("czero-qc|"+u.toLowerCase()+"|"+p);
  try{const b=await crypto.subtle.digest("SHA-256",t);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=2166136261;for(const c of t){h^=c;h=Math.imul(h,16777619)>>>0}return"f"+h.toString(16)}}
function cleanUser(u){return String(u||"").trim().toLowerCase()}
function validUser(u){return /^[a-z0-9._-]{3,30}$/.test(u)}
function validPin(p){return /^\d{4,8}$/.test(p)}
function me(){return S.session}
function acctName(u){return (S.accounts&&S.accounts[u]?.name)||u}
function verPill(i){return i.verified?'<span class="status st-ver">VERIFIED</span>':'<span class="status st-pending">PENDING</span>'}
function dbErr(e){return (e&&e.message)||"Could not save. Check your connection and try again."}

function demoSig(){const c=document.createElement("canvas");c.width=360;c.height=120;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,360,120);x.strokeStyle="#0c1f3a";x.lineWidth=3;x.lineCap="round";x.beginPath();
  let px=30,py=70;x.moveTo(px,py);for(let i=0;i<24;i++){px+=12;py=60+Math.sin(i*1.3)*24+(i%5?0:-14);x.lineTo(px,py)}x.stroke();return c.toDataURL("image/jpeg",.7)}

      const who=rnd()<.55?["ali","Ali Hassan"]:["amir","Amir Rahman"];const ver=dAgo>1||rnd()<.4;k++;
      const pile="CZ7"+bno.slice(-4).replace("-","")+String(i+1).padStart(3,"0");
      const st=!ver?"PENDING":ng.length?(rnd()<.6?"QUARANTINE":"REJECT"):"PASS";
      M.insp.push({id:"s"+k,cl:2,batchId:bid,batchNo:bno,pileId:pile,pileMethod:rnd()<.85?"scan":"key",product:PRODUCT,model:MODEL,panel:rnd()<.5?"A":"B",
        results:res,remarks:rem,ngItems:ng,status:st,led:ng.includes("B-1j")?["Green static","Red blinking","Red static"][k%3]:"Green blinking",led2:ng.includes("B-2g")?"Red static":"Green blinking",
        nameplateId:ng.includes("A-4b")?pile.slice(0,-1)+"9":pile,boxId:pile,cctvId:"{SN:BM10AD0A"+(10000+k)+",DT:DH-IPC-HFW1230S}",cctvPw:"",
        overall:ng.length?"Unit moved to rework area.":"",reinspect:false,checkedBy:who[0],checkedName:who[1],checkedAt:d.toISOString(),day:ymd(d),checkSignature:sig,
        verified:ver,verifiedBy:ver?"farah":"",verifiedName:ver?"Farah Aziz":"",verifiedAt:ver?new Date(d.getTime()+3*36e5).toISOString():"",verifyComment:"",signature:ver?sig:""})}});
}
async function mockApi(action,p){
  await new Promise(r=>setTimeout(r,150));
  const fail=m=>({ok:false,error:m}),ok=o=>({ok:true,...o});
  const pub=a=>({username:a.username,name:a.name,role:a.role});
  if(action==="ping")return ok({setup:true});
  if(action==="login"){const a=M.acc[cleanUser(p.username)];if(!a||a.pin!==String(p.pin))return fail("Username or PIN is not correct.");if(!a.active)return fail("This account is deactivated. Contact your admin.");return ok({token:"demo|"+a.username,user:pub(a)})}
  const me=M.acc[String(TOKEN).split("|")[1]];if(!me||!me.active)return fail("SESSION_EXPIRED");
  const need=r=>r.includes(me.role);
  switch(action){
    case"me":return ok({user:pub(me)});
    case"data":return ok({user:pub(me),batches:JSON.parse(JSON.stringify(M.batches)),inspections:JSON.parse(JSON.stringify(M.insp)),accounts:me.role==="admin"?Object.values(M.acc).map(a=>({username:a.username,name:a.name,role:a.role,active:a.active})):undefined});
    case"submit":{if(!need(["staff","admin"]))return fail("Your role cannot do this.");const d=p.insp,b=M.batches.find(x=>x.id===d.batchId);if(!b)return fail("Select the incoming batch.");
      const ng=Object.keys(d.results).filter(k=>d.results[k]==="NG");if(ng.some(k=>!(d.remarks[k]||"").trim()))return fail("Every NG item needs a remark.");const t=new Date();
      const row={...d,id:"n"+Date.now(),batchNo:b.batchNo,ngItems:ng,status:"PENDING",checkedBy:me.username,checkedName:me.name,checkedAt:t.toISOString(),day:ymd(t),verified:false};M.insp.push(row);return ok({id:row.id,status:row.status})}
    case"verify":{if(!need(["verifier","admin"]))return fail("Your role cannot do this.");if(!["PASS","QUARANTINE","REJECT"].includes(p.status))return fail("Select the final status.");let n=0,sk=0;const t=new Date().toISOString();
      M.insp.forEach(i=>{if(!p.ids.includes(i.id))return;if(i.verified||i.checkedBy===me.username||(p.status==="PASS"&&(i.ngItems||[]).length)){sk++;return}Object.assign(i,{verified:true,status:p.status,verifiedBy:me.username,verifiedName:me.name,verifiedAt:t,signature:p.signature,verifyComment:p.comment||""});n++});return ok({verified:n,skipped:sk})}
    case"changePin":if(me.pin!==String(p.oldPin))return fail("Current PIN is not correct.");me.pin=String(p.newPin);return ok({});
    case"createAccount":{if(!need(["admin"]))return fail("Your role cannot do this.");const u=cleanUser(p.username);if(M.acc[u])return fail(`Username ${u} is already taken.`);M.acc[u]={username:u,name:p.name,role:p.role,pin:String(p.pin),active:true};return ok({})}
    case"resetPin":{if(!need(["admin"]))return fail("Your role cannot do this.");const a=M.acc[p.username];if(!a)return fail("Account not found.");a.pin=String(p.pin);return ok({})}
    case"toggleAccount":{if(!need(["admin"]))return fail("Your role cannot do this.");if(p.username===me.username)return fail("You cannot deactivate your own account.");const a=M.acc[p.username];a.active=!a.active;return ok({active:a.active})}
    case"createBatch":{if(!need(["admin"]))return fail("Your role cannot do this.");M.batches.push({id:"b"+Date.now(),batchNo:p.batchNo,incomingQty:+p.incomingQty,receivedDate:p.receivedDate,model:p.model,open:true});return ok({})}
    case"toggleBatch":{const b=M.batches.find(x=>x.id===p.id);b.open=b.open===false;return ok({})}
    case"deleteBatch":{if(M.insp.some(i=>i.batchId===p.id))return fail("This batch has inspections and cannot be deleted. Close it instead.");M.batches=M.batches.filter(x=>x.id!==p.id);return ok({})}
  }
  return fail("Unknown action.");
}

/* ---------- API ---------- */
async function api(action,payload={}){
  let r;
  if(DEMO){r=await mockApi(action,payload)}
  else{
    if(!API)throw new Error("The system link is not set up.");
    let res;
    try{res=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,token:TOKEN,...payload}),redirect:"follow"})}
    catch(e){throw new Error("Cannot reach the Google Sheet. Check the internet connection and try again.")}
    try{r=await res.json()}catch(e){throw new Error("The Google Sheet link did not answer correctly. Check the Web app URL and its access setting (Anyone).")}
  }
  if(!r.ok){
    if(r.error==="SESSION_EXPIRED"){logout(true);throw new Error("Your session has ended. Please log in again.")}
    throw new Error(r.error||"Something went wrong.");
  }
  return r;
}
async function loadData(quiet){
  if(!S.session)return;
  try{
    const r=await api("data");
    const roleChanged=S.session.role!==r.user.role;
    S.session=r.user;
    S.batches=(r.batches||[]).sort((x,y)=>(y.receivedDate||"").localeCompare(x.receivedDate||""));
    S.insp=(r.inspections||[]).sort((x,y)=>(y.checkedAt||"").localeCompare(x.checkedAt||""));
    S.accounts={};(r.accounts||[]).forEach(a=>S.accounts[a.username]=a);
    S.loadedAt=new Date();
    if(roleChanged){S.tab=TABS[S.session.role][0][0];render()}else liveRender();
  }catch(e){if(!quiet)toast(e.message)}
}
function startPolling(){clearInterval(POLL);POLL=setInterval(()=>{if(document.visibilityState==="visible")loadData(true)},45000)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.session)loadData(true)});

(async function boot(){

  if(h==="#demo")DEMO=true;
  API=ls("czqc-api")||DEFAULT_API;
  if(!API&&!DEMO){S.phase="config";render();return}
  await start();
})();
async function start(){
  S.phase="loading";render();
  if(DEMO)await seedDemo();
  TOKEN=(DEMO?"":ls("czqc-token"))||"";
  try{
    const p=await api("ping");
    S.backendV=DEMO?2:(p.version||1);

const APP_VERSION="v2.0";
let LIVE=null;
async function startLive(target){
  unlockAudio();

  m.innerHTML=`<div class="t">Scan ${esc(SCAN_LABEL[target]||"ID")}</div>

  const video=$("#scan-video"),hint=$("#scan-hint");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){hint.textContent="This browser cannot open the camera here. Open the link in Safari (not inside another app), or use Photo.";return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}})}
  catch(e){
    const n=(e&&e.name)||"";
    hint.textContent=n==="NotAllowedError"?"Camera permission was refused. iPhone: Settings > Safari > Camera > Allow (or tap “aA” in the address bar > Website Settings > Camera > Allow), then try again.":
      n==="NotFoundError"||n==="OverconstrainedError"?"No camera was found. Use Photo or key in the ID.":

    return}
  if(!$("#scanmodal")){stream.getTracks().forEach(t=>t.stop());return}
  video.srcObject=stream;
  try{await video.play()}catch(e){}
  hint.textContent="Point at the QR or barcode. It reads automatically, or tap Snap.";
  $("#snap-btn").disabled=false;
  const cv=document.createElement("canvas"),cx=cv.getContext("2d",{willReadFrequently:true});
  const det=("BarcodeDetector" in window)?(()=>{try{return new BarcodeDetector()}catch(e){return null}})():null;
  LIVE={stream,running:true,frame:0,target,video};
  const cropTo=(W,H,frac,max)=>{const side=Math.min(W,H)*frac,sz=Math.round(Math.min(max,side));cv.width=sz;cv.height=sz;cx.drawImage(video,(W-side)/2,(H-side)/2,side,side,0,0,sz,sz);return sz};
  const fullTo=(W,H,max)=>{const sc=Math.min(1,max/Math.max(W,H));cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);cx.drawImage(video,0,0,cv.width,cv.height)};

  const tryZX=()=>{const rd=zxReader();if(!rd)return null;const Z=window.ZXing;try{const res=rd.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv))));return res?res.getText():null}catch(e){return null}};
  const tick=async()=>{
    if(!LIVE||!LIVE.running)return;
    let txt=null;
    try{
      if(video.readyState>=2&&video.videoWidth){
        const W=video.videoWidth,H=video.videoHeight,f=++LIVE.frame;
        if(f%10===0){const st=$("#scan-stat");if(st)st.textContent=`${APP_VERSION} · camera ${W}×${H} · scanning… ${f}`}
        if(det){try{const r=await det.detect(video);if(r&&r[0])txt=r[0].rawValue}catch(e){}}
        if(!txt){

    }catch(e){LIVE.err=(LIVE.err||0)+1;const st=$("#scan-stat");if(st)st.textContent=`${APP_VERSION} · error: ${e&&e.message||e}`}

async function loadImg(file){
  try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}
  try{return await createImageBitmap(file)}catch(e){}

let ZX=null;
function zxReader(){
  if(ZX||!window.ZXing)return ZX;
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.DATA_MATRIX,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.ITF]);

}
function tryCanvas(c){
  const x=c.getContext("2d",{willReadFrequently:true});
  if(window.jsQR){const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:"attemptBoth"});if(r&&r.data)return r.data}
  const rd=zxReader();
  if(rd){const Z=window.ZXing;
    for(const Bin of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){
      try{const res=rd.decodeWithState(new Z.BinaryBitmap(new Bin(new Z.HTMLCanvasElementLuminanceSource(c))));if(res&&res.getText())return res.getText()}catch(e){}}}
  return null;
}
async function decodeQR(file){
  const img=await loadImg(file);if(!img)throw new Error("photo could not be opened");
  const W=img.width||img.naturalWidth,H=img.height||img.naturalHeight;
  if("BarcodeDetector" in window){try{const d=new BarcodeDetector();const r=await d.detect(img);if(r&&r[0])return r[0].rawValue}catch(e){}}
  if(!window.jsQR&&!window.ZXing)return null;
  // whole photo at several sizes, centre crops, then a 3x3 grid of overlapping crops
  const regions=[[0,0,1,1,1600],[0,0,1,1,1100],[0,0,1,1,800],[.2,.2,.6,.6,1000],[.3,.3,.4,.4,800],[.375,.375,.25,.25,600]];
  for(let gy=0;gy<3;gy++)for(let gx=0;gx<3;gx++)regions.push([gx*.25,gy*.25,.5,.5,900]);
  for(const [rx,ry,rw,rh,max] of regions){
    const cw=W*rw,ch=H*rh,sc=Math.min(1,max/Math.max(cw,ch));

    const r=tryCanvas(c);if(r)return r;
    await new Promise(r=>setTimeout(r,0));
  }
  return null;
}

function dayChart(days,map){
  if(!days.length)return `<div class="empty">No inspections in this date range.</div>`;
  const W=900,H=220,pl=34,pb=26,pt=10,cw=(W-pl-8)/days.length,tot=d=>{const m=map[d]||{};return (m.pass||0)+(m.quar||0)+(m.rej||0)+(m.pend||0)},max=Math.max(1,...days.map(tot));
  const nice=max<=5?max:Math.ceil(max/5)*5,y=v=>H-pb-(v/nice)*(H-pb-pt);
  const ticks=[0,nice/2,nice].map(v=>Math.round(v)),every=Math.ceil(days.length/12);
  let g=ticks.map(v=>`<line x1="${pl}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("");
  const parts=[["pass","var(--ok)","FG"],["quar","var(--hold)","quarantine"],["rej","var(--ng)","reject"],["pend","var(--line)","awaiting"]];
  days.forEach((d,ix)=>{const m=map[d]||{},x=pl+ix*cw+cw*.15,w=Math.max(2,cw*.7);let acc=0;
    parts.forEach(([k,col,lab])=>{const v=m[k]||0;if(!v)return;g+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${y(acc)-y(acc+v)}" fill="${col}"><title>${dmy(d)}: ${v} ${lab}</title></rect>`;acc+=v});
    if(ix%every===0)g+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.slice(8)}/${d.slice(5,7)}</text>`});
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:520px;height:auto" role="img" aria-label="Inspections per day">${g}</svg></div>`}

function mountPad(cv){
  const r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;cv.width=r.width*dpr;cv.height=r.height*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);ctx.lineWidth=2.2;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#0c1f3a";
  let drawing=false,empty=true,last=null;
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{drawing=true;last=pos(e);cv.setPointerCapture(e.pointerId);ctx.beginPath();ctx.arc(last[0],last[1],1,0,7);ctx.fillStyle="#0c1f3a";ctx.fill();empty=false};
  cv.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();last=p};
  cv.onpointerup=cv.onpointercancel=()=>{drawing=false};
  return{isEmpty:()=>empty,clear:()=>{ctx.clearRect(0,0,cv.width,cv.height);empty=true},
    data:()=>{const o=document.createElement("canvas");o.width=360;o.height=120;const c=o.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,360,120);c.drawImage(cv,0,0,360,120);return o.toDataURL("image/jpeg",.7)}};
}

    case"back":S.detail=null;PAD=null;$("#view").innerHTML=viewHtml();afterRender();break;
    case"sel":t.checked?S.sel.add(t.dataset.id):S.sel.delete(t.dataset.id);if($("#v-btn"))$("#v-btn").textContent=`Verify ${S.sel.size} selected`;break;
    case"selall":document.querySelectorAll('[data-act="sel"]').forEach(c=>{c.checked=t.checked;t.checked?S.sel.add(c.dataset.id):S.sel.delete(c.dataset.id)});if($("#v-btn"))$("#v-btn").textContent=`Verify ${S.sel.size} selected`;break;
    case"padclear":PAD?.clear();break;
    case"cpadclear":CPAD?.clear();break;
    case"verifysel":verify([...S.sel],$("#v-err"),t);break;
    case"verifyone":verify([t.dataset.id],$("#v-err"),t);break;
    case"pdf":{const i=S.insp.find(x=>x.id===t.dataset.id);if(i)makePdf(i);break}
    case"csv":exportCsv();break;
    case"togglebatch":{const b=S.batches.find(x=>x.id===t.dataset.id);try{await api("toggleBatch",{id:b.id});await loadData(true);toast(`Batch ${b.batchNo} ${b.open===false?"reopened":"closed"}`)}catch(er){toast(dbErr(er))}break}
    case"delbatch":{if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirm delete";return}try{await api("deleteBatch",{id:t.dataset.id});await loadData(true);toast("Batch deleted")}catch(er){toast(dbErr(er))}break}
    case"resetpin":S.acctEdit=t.dataset.u;$("#view").innerHTML=viewHtml();$("#rp-pin")?.focus();break;
    case"cancelpin":S.acctEdit=null;$("#view").innerHTML=viewHtml();break;
    case"savepin":{const p=$("#rp-pin").value.trim(),u=t.dataset.u;if(!validPin(p)){$("#a-err2").textContent="PIN must be 4 to 8 digits.";return}
      try{await api("resetPin",{username:u,pin:p});S.acctEdit=null;toast(`PIN updated for ${u}`);$("#view").innerHTML=viewHtml()}catch(er){$("#a-err2").textContent=dbErr(er)}break}
    case"toggleacct":{const u=t.dataset.u,ac=S.accounts[u];try{await api("toggleAccount",{username:u});await loadData(true);toast(`${u} ${ac.active===false?"activated":"deactivated"}`)}catch(er){$("#a-err2").textContent=dbErr(er)}break}
  }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.f&&S.form&&t.tagName!=="SELECT"){S.form[t.dataset.f]=t.type==="checkbox"?t.checked:t.value;saveDraft();if(["pileId","nameplateId","boxId","cctvId"].includes(t.dataset.f))updateFormUI()}
  if(t.dataset.rem&&S.form){S.form.rem[t.dataset.rem]=t.value;saveDraft();updateFormUI()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.scan){handleScan(t);return}
  if(t.dataset.f==="batchId"&&S.form){S.form.batchId=t.value;saveDraft()}
  if((t.dataset.f==="led"||t.dataset.f==="led2"||t.dataset.f==="panel")&&S.form){S.form[t.dataset.f]=t.value;saveDraft();updateFormUI()}
  if(t.dataset.f==="pileMethod"&&S.form){S.form.pileMethod=t.value;S.form.pileId="";S.form.reinspect=false;saveDraft();$("#view").innerHTML=viewHtml();afterRender();(t.value==="key"?$("#f-pile"):null)?.focus()}
  if(t.dataset.filt){S.filt[t.dataset.filt]=t.value;$("#view").innerHTML=viewHtml();afterRender()}
});
document.addEventListener("paste",e=>{
  const t=e.target;if(!t||!t.dataset||!t.dataset.scanpaste||!S.form)return;
  const items=[...((e.clipboardData&&e.clipboardData.items)||[])];
  const img=items.find(i=>i.kind==="file"&&i.type.startsWith("image/"));
  if(img){e.preventDefault();applyScanFile(t.dataset.scanpaste,img.getAsFile());return}
  const txt=e.clipboardData&&e.clipboardData.getData("text");
  if(txt){e.preventDefault();setScanValue(t.dataset.scanpaste,txt.split(/\r?\n/)[0]);toast("Pasted: "+txt.split(/\r?\n/)[0].trim())}
});
document.addEventListener("keydown",e=>{const t=e.target;if(e.key==="Enter"&&t.dataset&&t.dataset.scanpaste){e.preventDefault();setScanValue(t.dataset.scanpaste,t.value);toast("Saved: "+t.value.trim())}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const id=e.target.id;
  if(id==="login-form"){const u=cleanUser($("#l-user").value),p=$("#l-pin").value.trim(),err=$("#l-err"),btn=$("#l-btn");err.textContent="";
    if(!u||!p){err.textContent="Key in your username and PIN.";return}
    btn.disabled=true;btn.textContent="Logging in…";
    try{const r=await api("login",{username:u,pin:p});TOKEN=r.token;if(!DEMO)ls("czqc-token",TOKEN);setSession(r.user);render();toast(`Welcome, ${r.user.name}`);await loadData()}
    catch(er){err.textContent=er.message;$("#l-pin").value="";btn.disabled=false;btn.textContent="Log in"}}
  if(id==="setup-form"){const n=$("#su-name").value.trim(),u=cleanUser($("#su-user").value),p=$("#su-pin").value.trim(),err=$("#su-err");
    if(!n)return err.textContent="Key in your full name.";if(!validUser(u))return err.textContent="Username must be 3–30 letters, numbers, dot, dash or underscore.";if(!validPin(p))return err.textContent="PIN must be 4 to 8 digits.";
    try{const r=await api("bootstrap",{name:n,username:u,pin:p});TOKEN=r.token;if(!DEMO)ls("czqc-token",TOKEN);S.phase="ready";setSession(r.user);render();await loadData()}catch(er){err.textContent=dbErr(er)}}
  if(id==="config-form"){const v=$("#c-url").value.trim(),err=$("#c-err");if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){err.textContent="That does not look like a Google Apps Script Web app link. It starts with https://script.google.com/macros/s/";return}ls("czqc-api",v);API=v;start()}
  if(id==="pin-form"){const o=$("#p-old").value.trim(),n1=$("#p-new").value.trim(),n2=$("#p-new2").value.trim(),err=$("#p-err");err.textContent="";
    if(!validPin(n1))return err.textContent="New PIN must be 4 to 8 digits.";if(n1!==n2)return err.textContent="The two new PINs do not match.";
    try{await api("changePin",{oldPin:o,newPin:n1});e.target.reset();toast("PIN changed")}catch(er){err.textContent=dbErr(er)}}
  if(id==="acct-form"){const n=$("#a-name").value.trim(),u=cleanUser($("#a-user").value),p=$("#a-pin").value.trim(),r=$("#a-role").value,err=$("#a-err");err.textContent="";
    if(!n)return err.textContent="Key in the full name.";if(!validUser(u))return err.textContent="Username must be 3–30 letters, numbers, dot, dash or underscore.";if(S.accounts[u])return err.textContent=`Username ${u} is already taken.`;if(!validPin(p))return err.textContent="PIN must be 4 to 8 digits.";
    try{await api("createAccount",{name:n,username:u,pin:p,role:r});toast(`Account ${u} created`);e.target.reset();await loadData(true)}catch(er){err.textContent=dbErr(er)}}
  if(id==="batch-form"){const no=$("#b-no").value.trim(),q=parseInt($("#b-qty").value,10),dte=$("#b-date").value,m=$("#b-model").value.trim()||MODEL,err=$("#b-err");err.textContent="";
    if(!no)return err.textContent="Key in the batch number.";if(!(q>0))return err.textContent="Incoming quantity must be at least 1.";if(S.batches.some(b=>b.batchNo.toLowerCase()===no.toLowerCase()))return err.textContent=`Batch ${no} already exists.`;
    try{await api("createBatch",{batchNo:no,incomingQty:q,receivedDate:dte||today(),model:m});toast(`Batch ${no} added`);$("#b-no").value="";$("#b-qty").value="";await loadData(true)}catch(er){err.textContent=dbErr(er)}}
});
</script>
</body>
</html>
